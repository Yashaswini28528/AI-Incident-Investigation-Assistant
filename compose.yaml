
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-backend
    env_file:
      - .env
    ports:
      - "8000:10000"
    volumes:
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: incident-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:10000
    depends_on:
      - backend
